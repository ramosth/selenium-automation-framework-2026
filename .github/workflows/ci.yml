# ============================================================
# CI - Selenium Automation Framework (Sauce Demo)
#
# Quando roda:
#   - a cada push e pull request na branch master;
#   - manualmente pela aba "Actions" > "CI - Testes Selenium" > "Run workflow",
#     escolhendo a suíte (regression, login, checkout, login-parameters) e o navegador.
#
# O que faz:
#   1. instala o Java 17 e baixa as dependências do Maven (com cache);
#   2. cria o config.properties a partir do modelo (o arquivo real fica fora do Git);
#   3. roda a suíte em modo headless (sem abrir janela);
#      o relatório é enviado por e-mail SE os segredos EMAIL_* estiverem cadastrados
#      (Settings > Secrets and variables > Actions). Sem eles, o envio fica desligado;
#   4. publica o relatório Extent, os prints e os logs como "artifacts" da execução,
#      mesmo quando algum teste falha.
# ============================================================
name: CI - Testes Selenium

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suíte do TestNG (src/test/resources/suites)"
        type: choice
        options: [regression, login, checkout, login-parameters, inventory, product-users, navigation, dynamic-catalog]
        default: regression
      browser:
        description: "Navegador"
        type: choice
        options: [chrome, firefox]
        default: chrome

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Em push/PR os inputs não existem, então usamos os valores padrão
      SUITE: ${{ inputs.suite || 'regression' }}
      BROWSER: ${{ inputs.browser || 'chrome' }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Java 17 (com cache do Maven)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Criar config.properties a partir do modelo
        run: cp src/test/resources/config.properties.example src/test/resources/config.properties

      - name: Rodar a suíte ${{ env.SUITE }} no ${{ env.BROWSER }} (headless)
        # Os segredos entram como variáveis de ambiente e o GitHub os mascara no log (***).
        # Eles chegam ao framework via -D, que tem prioridade sobre o config.properties.
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          # Liga o e-mail só se a senha de app foi cadastrada nos segredos
          if [ -n "$EMAIL_APP_PASSWORD" ]; then EMAIL_ENABLED=true; else EMAIL_ENABLED=false; fi
          echo "Envio de e-mail: $EMAIL_ENABLED"

          mvn -B test \
            -Dsuite="$SUITE" \
            -Dbrowser="$BROWSER" \
            -Dheadless=true \
            -Demail.enabled="$EMAIL_ENABLED" \
            -Demail.sender="$EMAIL_SENDER" \
            -Demail.appPassword="$EMAIL_APP_PASSWORD" \
            -Demail.recipients="$EMAIL_RECIPIENTS"

      - name: Publicar relatório, prints e logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-${{ env.SUITE }}-${{ github.run_number }}
          path: |
            reports/
            screenshots/
            logs/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn
